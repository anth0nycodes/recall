appId: com.recall.app
productName: Recall
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.renderer.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: drizzle
    to: drizzle
mac:
  target:
    - dmg
  category: public.app-category.productivity
  # macOS kills any process that asks for Contacts without a usage string in its
  # Info.plist, so this key is required for requestContactsAccess() to work.
  extendInfo:
    NSContactsUsageDescription: Recall uses your contacts to show names instead of phone numbers and email addresses. Contact data never leaves your Mac.
npmRebuild: false
