appId: com.recall.app
productName: Recall
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.renderer.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: drizzle
    to: drizzle
mac:
  target:
    - dmg
  category: public.app-category.productivity
npmRebuild: false
